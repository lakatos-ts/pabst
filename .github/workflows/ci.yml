name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# A superseded pull-request run is cancelled; a merge-queue run never is.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run format:check

  test:
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # Vitest transpiles without typechecking.
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npx vitest run

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      # The ratchet moves on local runs; CI only enforces.
      - name: Coverage gate
        run: npx vitest run --coverage --coverage.thresholds.autoUpdate=false
